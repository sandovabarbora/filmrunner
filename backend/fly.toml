# Fly.io app for the FilmRunner API. Deployed by the founder with
# scripts/deploy_api.sh; there is no deploy workflow (ADR-002). Secrets are set on the
# platform (`fly secrets set`), never in this file:
#   FILMRUNNER_DATABASE_URL, FILMRUNNER_API_BEARER_TOKEN,
#   FILMRUNNER_ENVIRONMENT=production, FILMRUNNER_CORS_ORIGINS
app = "filmrunner-api"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Migrations run once per release, before the new version serves traffic.
  release_command = "alembic upgrade head"

[env]
  FILMRUNNER_LOG_LEVEL = "INFO"
  FILMRUNNER_PUBLIC_BASE_URL = "https://filmrunner-api.fly.dev"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  # /healthz, not /readyz: with /readyz a paused database takes the only machine out of routing, so the crew gets the proxy's error, not the API's.
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
