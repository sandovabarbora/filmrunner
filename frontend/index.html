<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FilmRunner — Call Sheet</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0b0b0c" />
<style>
  :root {
    --bg: #0b0b0c;
    --panel: #151517;
    --border: #2a2a2e;
    --text: #eef0f2;
    --muted: #9a9ca1;
    --accent: #f4c542;
    --danger: #e2574c;
    --ok: #4caf7d;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    padding: 16px;
    padding-bottom: 48px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.1rem; letter-spacing: 0.02em; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 20px; }

  .lookup {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .lookup input {
    flex: 1;
    min-width: 200px;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 0.9rem;
  }
  .lookup button {
    background: var(--accent);
    color: #14140f;
    border: none;
    padding: 10px 16px;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.9rem;
  }
  .lookup button:active { transform: translateY(1px); }

  .status {
    font-size: 0.8rem;
    padding: 8px 12px;
    border-radius: 6px;
    margin-bottom: 16px;
    display: none;
  }
  .status.offline { display: block; background: rgba(226, 87, 76, 0.15); color: var(--danger); border: 1px solid rgba(226, 87, 76, 0.4); }
  .status.online { display: block; background: rgba(76, 175, 125, 0.15); color: var(--ok); border: 1px solid rgba(76, 175, 125, 0.4); }
  .status.error { display: block; background: rgba(226, 87, 76, 0.15); color: var(--danger); border: 1px solid rgba(226, 87, 76, 0.4); }

  .sheet {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    display: none;
  }
  .sheet.visible { display: block; }

  .sheet-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    border-bottom: 1px solid var(--border);
    padding-bottom: 14px;
    margin-bottom: 14px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .sheet-header .day { font-size: 1.3rem; font-weight: 700; }
  .rev-badge {
    display: inline-block;
    background: var(--accent);
    color: #14140f;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 0.8rem;
    margin-left: 8px;
  }

  .info-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 10px;
    margin-bottom: 16px;
  }
  .info-box {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
  }
  .info-box .label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .info-box .value { font-size: 1rem; font-weight: 600; margin-top: 2px; }

  .safety {
    background: rgba(226, 87, 76, 0.1);
    border: 1px solid rgba(226, 87, 76, 0.35);
    border-radius: 6px;
    padding: 10px 12px;
    font-size: 0.85rem;
    margin-bottom: 16px;
  }
  .safety .label { color: var(--danger); font-weight: 700; font-size: 0.75rem; text-transform: uppercase; margin-bottom: 4px; }

  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 0.75rem; text-transform: uppercase; }

  .cached-at { color: var(--muted); font-size: 0.75rem; margin-top: 16px; }

  .actions { margin-top: 16px; display: flex; gap: 8px; }
  .actions button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 0.8rem;
    cursor: pointer;
  }

  @media print {
    body { background: #fff; color: #000; padding: 0; }
    .lookup, .status, .actions { display: none !important; }
    .sheet { border: none; box-shadow: none; }
    .info-box, .safety { background: #fff; border: 1px solid #999; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>FilmRunner · call sheet</h1>
    <div class="sub" id="subtitle">Loading…</div>

    <div class="lookup" id="lookup" style="display:none;">
      <input type="text" id="apiBase" placeholder="API base, e.g. http://localhost:8000" value="http://localhost:8000" />
      <input type="text" id="callSheetId" placeholder="Call sheet ID" />
      <button id="loadBtn">Load</button>
    </div>

    <div id="status" class="status"></div>

    <div id="sheet" class="sheet">
      <div class="sheet-header">
        <div>
          <div class="day" id="dayLabel"></div>
          <div class="sub" id="dateLabel"></div>
        </div>
        <div id="revBadgeWrap"></div>
      </div>

      <div class="info-grid">
        <div class="info-box"><div class="label">Crew call</div><div class="value" id="crewCall">—</div></div>
        <div class="info-box"><div class="label">Shooting call</div><div class="value" id="shootingCall">—</div></div>
        <div class="info-box"><div class="label">Sunrise</div><div class="value" id="sunrise">—</div></div>
        <div class="info-box"><div class="label">Sunset</div><div class="value" id="sunset">—</div></div>
        <div class="info-box"><div class="label">Weather</div><div class="value" id="weather">—</div></div>
      </div>

      <div class="safety" id="safetyBox" style="display:none;">
        <div class="label">Safety notes</div>
        <div id="safetyText"></div>
      </div>

      <table>
        <thead>
          <tr><th>#</th><th>Scene</th><th>Int/Ext</th><th>Day/Night</th><th>Set</th><th>Pages</th></tr>
        </thead>
        <tbody id="scheduleBody"></tbody>
      </table>

      <div class="cached-at" id="cachedAt"></div>

      <div class="actions">
        <button onclick="window.print()">Print</button>
      </div>
    </div>
  </div>

<script>
/**
 * Offline-first call sheet viewer.
 *
 * Strategy: try the network; on success, render and persist the payload
 * plus a fetchedAt timestamp to IndexedDB keyed by call sheet id. On
 * failure (offline, DNS, timeout), fall back to whatever is in IndexedDB
 * for that id and say plainly that it's a cached, possibly stale, copy —
 * a crew member on a rural set needs to know if what they're looking at
 * could be out of date, not just see a call sheet.
 *
 * Reference: https://developer.mozilla.org/en-US/docs/Web/API/IndexedDB_API/Using_IndexedDB
 */

const DB_NAME = "filmrunner-callsheets";
const STORE_NAME = "callsheets";

function openDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => {
      req.result.createObjectStore(STORE_NAME, { keyPath: "id" });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function cacheCallSheet(id, data) {
  const db = await openDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, "readwrite");
    tx.objectStore(STORE_NAME).put({ id, data, fetchedAt: new Date().toISOString() });
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function getCachedCallSheet(id) {
  const db = await openDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, "readonly");
    const req = tx.objectStore(STORE_NAME).get(id);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}

function setStatus(kind, text) {
  const el = document.getElementById("status");
  el.className = "status " + kind;
  el.textContent = text;
}

function renderCallSheet(callSheet, { fromCache, fetchedAt } = {}) {
  const rev = callSheet.current_revision;
  document.getElementById("dayLabel").textContent =
    `Day ${callSheet.day_number} of ${callSheet.day_count} — ${callSheet.unit_name}`;
  document.getElementById("dateLabel").textContent = callSheet.shoot_date;

  const revWrap = document.getElementById("revBadgeWrap");
  revWrap.textContent = "";
  if (rev) {
    const badge = document.createElement("span");
    badge.className = "rev-badge";
    badge.textContent = `REV ${rev.revision_letter}`;
    revWrap.appendChild(badge);
  }

  document.getElementById("crewCall").textContent = rev?.general_crew_call || "—";
  document.getElementById("shootingCall").textContent = rev?.shooting_call || "—";
  document.getElementById("sunrise").textContent = rev?.sunrise || "—";
  document.getElementById("sunset").textContent = rev?.sunset || "—";
  document.getElementById("weather").textContent = rev?.weather_forecast || "—";

  const safetyBox = document.getElementById("safetyBox");
  if (rev?.safety_notes) {
    safetyBox.style.display = "block";
    document.getElementById("safetyText").textContent = rev.safety_notes;
  } else {
    safetyBox.style.display = "none";
  }

  const tbody = document.getElementById("scheduleBody");
  tbody.innerHTML = "";
  (rev?.schedule_items || [])
    .slice()
    .sort((a, b) => a.order_index - b.order_index)
    .forEach((item) => {
      const eighths = item.page_count_eighths;
      const pages = `${Math.floor(eighths / 8)} ${eighths % 8}/8`.trim();
      const row = document.createElement("tr");
      // textContent, never innerHTML: schedule text comes from the server and
      // a crew phone must not execute whatever someone typed into a set note.
      [item.order_index, item.scene_number, item.int_ext, item.day_night, item.set_description, pages]
        .forEach((value) => {
          const cell = document.createElement("td");
          cell.textContent = value == null ? "" : String(value);
          row.appendChild(cell);
        });
      tbody.appendChild(row);
    });

  document.getElementById("cachedAt").textContent = fromCache
    ? `Showing cached copy from ${new Date(fetchedAt).toLocaleString()} — offline.`
    : `Live, fetched just now.`;

  document.getElementById("sheet").classList.add("visible");
}

async function loadCallSheet() {
  const apiBase = document.getElementById("apiBase").value.replace(/\/$/, "");
  const id = document.getElementById("callSheetId").value.trim();
  if (!id) {
    setStatus("error", "Enter a call sheet ID.");
    return;
  }
  await loadFrom(`${apiBase}/api/v1/public/call-sheets/${id}`, id);
}

/**
 * Demo mode (?demo=1): a bundled sample call sheet served next to the app,
 * so the deployed page shows a real shoot day with no backend. It goes
 * through the same cache path as API data, so it works offline too.
 */
const DEMO_URL = "demo/call-sheet.json";
const DEMO_ID = "demo";

async function loadDemo() {
  document.getElementById("subtitle").textContent =
    "Demo shoot day. Add this page to your home screen; it keeps working with no signal.";
  await loadFrom(DEMO_URL, DEMO_ID);
}

/**
 * Entry point. The URL decides what the page is:
 *   ?sheet=<id>&api=<base>  a shared call sheet from a FilmRunner API (crew link)
 *   ?dev=1                  the lookup form, for local development
 *   anything else           the bundled demo, so the public URL never shows a form
 */
function boot() {
  const params = new URLSearchParams(window.location.search);
  const sheet = params.get("sheet");
  const api = params.get("api");
  if (sheet && api) {
    document.getElementById("apiBase").value = api;
    document.getElementById("callSheetId").value = sheet;
    document.getElementById("subtitle").textContent =
      "Your call sheet. Add this page to your home screen; it keeps working with no signal.";
    loadCallSheet();
    return;
  }
  if (params.get("dev") === "1") {
    document.getElementById("lookup").style.display = "";
    document.getElementById("subtitle").textContent =
      "Development mode: point at a FilmRunner API and enter a call sheet ID.";
    return;
  }
  loadDemo();
}

async function loadFrom(url, id) {
  try {
    const resp = await fetch(url, {
      signal: AbortSignal.timeout(5000),
    });
    if (!resp.ok) {
      throw new Error(`API returned ${resp.status}`);
    }
    const data = await resp.json();
    await cacheCallSheet(id, data);
    setStatus("online", "Live data, cached for offline viewing.");
    renderCallSheet(data, { fromCache: false });
  } catch (err) {
    const cached = await getCachedCallSheet(id);
    if (cached) {
      setStatus("offline", `Network unavailable (${err.message}). Showing last cached revision.`);
      renderCallSheet(cached.data, { fromCache: true, fetchedAt: cached.fetchedAt });
    } else {
      setStatus("error", `Could not reach the server and nothing is cached for this ID yet (${err.message}).`);
      document.getElementById("sheet").classList.remove("visible");
    }
  }
}

document.getElementById("loadBtn").addEventListener("click", loadCallSheet);
document.getElementById("callSheetId").addEventListener("keydown", (e) => {
  if (e.key === "Enter") loadCallSheet();
});

boot();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch((err) => {
      console.warn("Service worker registration failed:", err);
    });
  });
}
</script>
</body>
</html>
