name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: filmrunner
          POSTGRES_PASSWORD: filmrunner_dev
          POSTGRES_DB: filmrunner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FILMRUNNER_DATABASE_URL: postgresql+psycopg://filmrunner:filmrunner_dev@localhost:5432/filmrunner_test
      FILMRUNNER_API_BEARER_TOKEN: ci-only-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend build (typecheck + vite)
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Install
        run: |
          pip install -r backend/requirements.txt -r frontend/tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Branch and PR title conventions
        if: github.event_name == 'pull_request'
        env:
          BRANCH: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title }}
        run: python scripts/check_conventions.py "$BRANCH" "$TITLE"
      - name: Company docs format
        run: python scripts/check_company_docs.py docs/company
      - name: One Alembic head
        run: sh scripts/check_migrations.sh
      - name: Checker tests
        run: python -m pytest scripts/tests -q
      - name: Backend tests
        working-directory: backend
        run: python -m pytest tests -q
      - name: Frontend smoke
        run: python -m pytest frontend/tests -q
