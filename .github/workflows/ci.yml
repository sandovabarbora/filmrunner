name: ci

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same PR cancels the older run; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: filmrunner
          POSTGRES_PASSWORD: filmrunner_dev
          POSTGRES_DB: filmrunner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FILMRUNNER_DATABASE_URL: postgresql+psycopg://filmrunner:filmrunner_dev@localhost:5432/filmrunner_test
      FILMRUNNER_API_BEARER_TOKEN: ci-only-token
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Docs-only changes skip the heavy steps on the PR and on the push to
      # main alike; before, every merged state PR reran the full suite on main.
      # Decided inside this job because each separate job bills a whole minute.
      - name: Decide whether heavy steps run
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if ! CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA"); then
            echo "No usable base $BASE_SHA, running everything"
            echo "RUN_HEAVY=true" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "Changed files:"
          echo "$CHANGED"
          if [ -n "$(echo "$CHANGED" | grep -v '^docs/' || true)" ]; then
            echo "RUN_HEAVY=true" >> "$GITHUB_ENV"
          else
            echo "RUN_HEAVY=false" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        if: env.RUN_HEAVY == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend build (typecheck + vite)
        if: env.RUN_HEAVY == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Install Python test deps
        run: pip install -r backend/requirements.txt -r frontend/tests/requirements.txt
      - name: Install Playwright browser
        if: env.RUN_HEAVY == 'true'
        run: python -m playwright install --with-deps chromium
      - name: Branch and PR title conventions
        if: github.event_name == 'pull_request'
        env:
          BRANCH: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title }}
        run: python scripts/check_conventions.py "$BRANCH" "$TITLE"
      - name: Company docs format
        run: python scripts/check_company_docs.py docs/company
      - name: Backlog freshness (warning only, FR-132)
        run: python scripts/check_backlog_freshness.py docs/company/BACKLOG.md
      - name: One Alembic head
        run: sh scripts/check_migrations.sh
      - name: Checker tests
        run: python -m pytest scripts/tests -q
      - name: Backend tests
        if: env.RUN_HEAVY == 'true'
        working-directory: backend
        run: python -m pytest tests -q
      - name: Frontend smoke
        if: env.RUN_HEAVY == 'true'
        run: python -m pytest frontend/tests -q
      - name: Pilot-scale Lighthouse and PDF regression gate (FR-103)
        if: env.RUN_HEAVY == 'true'
        working-directory: frontend
        run: |
          python3 scripts/lighthouse_pilot_scale.py
          python3 scripts/lighthouse_landing.py
          python3 scripts/pdf_pilot_scale.py
      - name: PWA manifest/installability gate (FR-102)
        if: env.RUN_HEAVY == 'true'
        working-directory: frontend
        run: python3 scripts/check_pwa_manifest.py
