name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      docs_only: ${{ steps.check.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine if this PR touches only docs/
        id: check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "Changed files:"
          echo "$CHANGED"
          if [ -n "$(echo "$CHANGED" | grep -v '^docs/' || true)" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi

  ci:
    needs: [changes]
    if: always()
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: filmrunner
          POSTGRES_PASSWORD: filmrunner_dev
          POSTGRES_DB: filmrunner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FILMRUNNER_DATABASE_URL: postgresql+psycopg://filmrunner:filmrunner_dev@localhost:5432/filmrunner_test
      FILMRUNNER_API_BEARER_TOKEN: ci-only-token
      RUN_HEAVY: ${{ github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend build (typecheck + vite)
        if: env.RUN_HEAVY == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Install Python test deps
        run: pip install -r backend/requirements.txt -r frontend/tests/requirements.txt
      - name: Install Playwright browser
        if: env.RUN_HEAVY == 'true'
        run: python -m playwright install --with-deps chromium
      - name: Branch and PR title conventions
        if: github.event_name == 'pull_request'
        env:
          BRANCH: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title }}
        run: python scripts/check_conventions.py "$BRANCH" "$TITLE"
      - name: Company docs format
        run: python scripts/check_company_docs.py docs/company
      - name: Backlog freshness (warning only, FR-132)
        run: python scripts/check_backlog_freshness.py docs/company/BACKLOG.md
      - name: One Alembic head
        run: sh scripts/check_migrations.sh
      - name: Checker tests
        run: python -m pytest scripts/tests -q
      - name: Backend tests
        if: env.RUN_HEAVY == 'true'
        working-directory: backend
        run: python -m pytest tests -q
      - name: Frontend smoke
        if: env.RUN_HEAVY == 'true'
        run: python -m pytest frontend/tests -q
      - name: Pilot-scale Lighthouse and PDF regression gate (FR-103)
        if: env.RUN_HEAVY == 'true'
        working-directory: frontend
        run: |
          python3 scripts/lighthouse_pilot_scale.py
          python3 scripts/lighthouse_landing.py
          python3 scripts/pdf_pilot_scale.py
      - name: PWA manifest/installability gate (FR-102)
        if: env.RUN_HEAVY == 'true'
        working-directory: frontend
        run: python3 scripts/check_pwa_manifest.py
