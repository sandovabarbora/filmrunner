# FR-118: `scripts/check_backlog_duplicates.py` shells out to `gh pr list --json ...`, same as
# `scripts/pr_merge_report.py` (FR-114) -- this sandbox does not have `gh` installed, unlike
# GitHub-hosted runners, which ship it preauthenticated via GH_TOKEN. Dispatched manually to
# verify `fetch_open_prs()` end to end, the same pattern FR-66/67/68/83/114 used for the same gap.
name: Check backlog duplicates (FR-118)

on:
  workflow_dispatch:
    inputs:
      title:
        description: candidate backlog item title
        required: true
      why:
        description: candidate backlog item's why line
        required: true

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Warn about likely duplicates for the candidate title/why
        run: |
          python3 scripts/check_backlog_duplicates.py \
            --title "${{ inputs.title }}" \
            --why "${{ inputs.why }}"
