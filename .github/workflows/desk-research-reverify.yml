# FR-83: re-verify FR-2/FR-20/FR-21 desk-research claims that are marked
# "unverified" purely because this routine's own sandbox proxy blocks direct
# fetches of vendor and public-data domains (confirmed again by every one of
# those items' own shifts). GitHub's runners have open egress, the same
# pattern FR-66/67/68 already used for the live stack and the astronomy
# formula — this job points that same open egress at the research docs'
# own cited-but-unreachable pages instead.
#
# workflow_dispatch only: the underlying vendor pages change rarely, no need
# for a recurring schedule (unlike pilot-readiness.yml, which watches a live
# service).
name: desk research re-verify (FR-83)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reverify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch cited pages and report matches
        run: python3 scripts/reverify_desk_research.py

      - name: Upload the raw report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desk-research-reverify
          path: docs/research/desk-research-reverify.json

      # FR-88: the substring-match step above only proves the Czech Film
      # Commission statistics page is reachable, not what number it states.
      # This dumps its actual text so a real figure can be read off it.
      - name: Dump the Czech Film Commission statistics page text
        run: python3 scripts/fetch_page_text.py https://filmcommission.cz/en/statistics/

      # FR-89: reverify_desk_research.py's substring check only proved the
      # two ep.com Movie Magic Scheduling pages are reachable and contain a
      # dollar sign; it did not say which product/tier each price belongs to.
      # This dumps the full text (including JSON-LD) so the actual product
      # name next to each figure can be read directly.
      - name: Dump the Movie Magic Scheduling pricing pages text
        run: python3 scripts/fetch_page_text.py https://www.ep.com/ep-store/movie-magic-scheduling-monthly/ https://www.ep.com/ep-store/movie-magic-scheduling-annual/ https://www.ep.com/movie-magic-scheduling/

      # FR-90: reverify_desk_research.py's plain fetch gets StudioBinder,
      # Yamdu and SetHero's raw HTML before their own client-side JS has run,
      # so no readable pricing/feature text ever shows up. This renders the
      # same pages with real headless Chromium instead.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          pip install -r frontend/tests/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Render client-rendered pricing pages
        run: python3 scripts/render_pricing_pages.py
