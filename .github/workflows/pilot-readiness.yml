# FR-66: the live stack, checked from somewhere that can actually reach it.
#
# Every FR-8/FR-16/FR-40 attempt from the routine's sandbox has been blocked by its egress proxy
# (403 CONNECT to filmrunner-api.fly.dev), so "not verified" kept meaning "could not look", not
# "does not work". GitHub's runners have open egress; this job looks for us, daily and on demand,
# and writes a pass/fail table into the run summary a shift can read instead of retrying a curl.
#
# Public, unauthenticated endpoints only: no tokens live here.
name: pilot readiness (live)

on:
  workflow_dispatch:
  schedule:
    - cron: "10 5 * * *" # 07:10 Prague in summer, 06:10 in winter — before a Czech crew call

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      API: ${{ vars.VITE_API_BASE || 'https://filmrunner-api.fly.dev' }}
      PAGES: https://sandovabarbora.github.io/filmrunner
      # FR-68: a dedicated write-capable token, set once the founder files INBOX (FR-68's own
      # gated item). Empty until then, which is exactly what the next step's guard checks for.
      FILMRUNNER_CI_TOKEN: ${{ secrets.FILMRUNNER_CI_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the live stack
        run: python3 scripts/check_live_stack.py

      - name: Check astronomy accuracy against a live reference
        if: always()
        run: PYTHONPATH=backend python3 scripts/check_astronomy_accuracy.py

      # FR-68: create a production and publish real revisions on the live stack to exercise five
      # write-path features (delete a location, weather auto-fill, tomorrow/days-at-a-glance,
      # the personal calls picker) that the two read-only checks above cannot reach. Skipped, not
      # failed, until FILMRUNNER_CI_TOKEN exists (see INBOX.md) — a rotated or revoked token also
      # reads as skipped (the script itself tells a 401 apart from a real failure).
      - name: Check the live write path
        if: always() && env.FILMRUNNER_CI_TOKEN != ''
        run: python3 scripts/check_live_write_path.py

      - name: Note the live write-path check was skipped
        if: always() && env.FILMRUNNER_CI_TOKEN == ''
        run: |
          echo "## Live write-path checks (FR-68) — skipped: FILMRUNNER_CI_TOKEN is not set (see INBOX.md)" >> "$GITHUB_STEP_SUMMARY"
